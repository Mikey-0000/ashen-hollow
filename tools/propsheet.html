<!DOCTYPE html><html><body style="margin:0;background:#2a2a30"><canvas id="c" width="1300" height="900"></canvas>
<script src="../src/core/util.js"></script><script src="../src/core/font.js"></script><script src="../src/core/sprites.js"></script><script src="../src/game/tiles.js"></script><script src="../src/game/props.js"></script>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
let x=6,y=6,rowH=0;const sc=2;
function put(spr,s){ s=s||sc; const w=(spr.w||spr.width), h=(spr.h||spr.height), cv=spr.c||spr; if(x+w*s>1290){x=6;y+=rowH+6;rowH=0;} g.drawImage(cv,x,y,w*s,h*s);x+=w*s+6;rowH=Math.max(rowH,h*s);}
const L=AH.Tiles.lib;
['grass','moss','dirt','mud','leaves','cobble','crypt','flag','wood','carpet','bones','rune','bridge'].forEach(k=>L[k].forEach(t=>put(t,3)));
x=6;y+=rowH+6;rowH=0;
['stone','crypt','timber','rock'].forEach(k=>{L['wall_'+k].cap.slice(0,1).forEach(t=>put(t,3));L['wall_'+k].mid.slice(0,2).forEach(t=>put(t,3));});
put(L.water[0],3);put(L.deep[1],3);put(L.fenceIron[0],3);put(L.fenceWood[0],3);put(L.hedge[0],3);put(L.treeline[0],3);
x=6;y+=rowH+6;rowH=0;
const P=AH.Props.spr;
Object.keys(P).forEach(k=>{const v=P[k];if(Array.isArray(v)){v.slice(0,k==='tree_oak'||k.startsWith('tree')?3:2).forEach(s=>put(s,k.startsWith('tree')?1:2));}else put(v,2);});
</script></body></html>
